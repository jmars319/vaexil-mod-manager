[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/jmars319/vaexil-mod-manager"
rust-version = "1.92"
publish = false

[workspace.dependencies]
vmm-core = { path = "crates/core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
