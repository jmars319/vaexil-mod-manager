name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, and build
    # GitHub-hosted on purpose: this repository is public, and self-hosted
    # runners must not run code from pull requests.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # ADR 0003: front ends reach backends only through vmm-engine.
      - name: Front ends depend on the engine, not on backends
        shell: bash
        run: |
          for front in vaexil-mod-manager vmm-cli; do
            if cargo tree -p "$front" -e normal --depth 1 --locked | grep -E 'vmm-backend-'; then
              echo "$front depends on a backend crate directly; go through vmm-engine instead." >&2
              exit 1
            fi
          done

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # ADR 0003: the JSON contract is committed under schema/ and must match
      # the code. A deliberate change regenerates it with `vmm schema --out schema`.
      - name: The committed JSON schema matches the code
        shell: bash
        run: |
          cargo run --locked -q -p vmm-cli -- schema --out schema > /dev/null
          if [ -n "$(git status --porcelain -- schema)" ]; then
            git status --porcelain -- schema
            git diff -- schema
            echo "schema/ is out of date: run 'cargo run -p vmm-cli -- schema --out schema' and commit it." >&2
            exit 1
          fi

      - name: Release build
        run: cargo build --release --locked -p vaexil-mod-manager -p vmm-cli

      # The click smoke test deploys with this stand-in for SMF's Deploy.exe.
      - name: Build the stand-in Deploy.exe
        run: cargo build --release --locked -p vaexil-mod-manager --example fake-deploy

      - name: Report binary size
        shell: pwsh
        run: |
          $exe = Get-Item target/release/vaexil-mod-manager.exe
          "vaexil-mod-manager.exe: {0:N1} MB" -f ($exe.Length / 1MB) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The smoke tests drive the release build's real window against a
      # throwaway fake game folder, as Modlist Launcher's CI does.
      - name: Smoke test, repaint after minimize and restore
        shell: pwsh
        run: ./scripts/smoke-minimize-restore.ps1

      - name: Smoke test, real mouse clicks
        shell: pwsh
        run: ./scripts/smoke-mouse-clicks.ps1

      # A failed click check saves a picture of the app's window.
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
