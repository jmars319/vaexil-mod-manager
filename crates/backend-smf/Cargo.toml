# Reading SMF's Release.zip (E7). Deflate only, in pure Rust (miniz_oxide).
zip = { version = "9.5", default-features = false, features = ["deflate-flate2", "deflate64"] }
flate2 = "1"

[dev-dependencies]
tempfile.workspace = true
