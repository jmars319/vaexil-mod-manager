[package]
name = "vmm-cli"
description = "vmm.exe, the command line of Vaexil Mod Manager: every engine operation, with --json for tools and AI clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vmm"
path = "src/main.rs"

[dependencies]
vmm-core.workspace = true
vmm-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# The MCP server (`vmm mcp`): stdio only. No HTTP, TLS or network transport
# is enabled; deny.toml's ban on those crates must keep passing.
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "sync"] }

[dev-dependencies]
tempfile.workspace = true
